[package]
name = "sophon-lib"
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94.1"

[features]
default = ["vendored-hpatchz"]
vendored-hpatchz = []
paimon = ["dep:paimon"]
extra-logs = []

[dependencies]
zstd = { version = "0.14" }
reqwest = { version = "0.13", features = ["blocking", "h2", "http2", "json", "socks"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
md-5 = "0.11.0"
digest-io = "0.1.0"
base16ct = "1.0.0"
tracing = "0.1.41"
fs2 = "0.4.3"
crossbeam-channel = "0.5.15"
bytes = "1.11.0"
fs_extra = "1.3.0"
prost = "0.14.3"
interprocess = "2.4.0"
rand = "0.10.0"
paimon = { git = "https://dawn.wine/lily/paimon", version = "0.1.0", optional = true }

[build-dependencies]
md-5 = "0.11.0"
prost-build = "0.14.3"
base16ct = "1.0.0"
