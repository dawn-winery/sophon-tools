[package]
name = "sophon-lib"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94.1"

[features]
default = ["vendored-hpatchz"]
vendored-hpatchz = []
paimon = ["dep:paimon"]
extra-logs = []

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "h2", "http2", "json", "socks", "gzip"], default-features = false }

tokio = { version = "1.54.1", features = ["fs", "io-util", "sync"] }
futures = { version = "0.3.34", features = ["cfg-target-has-atomic"] }

crossbeam-channel = "0.5.15"
interprocess = "2.4.0"

serde = { version = "1.0.219", features = ["derive"] }
prost = "0.14.3"

tracing = "0.1.41"
thiserror = "2.0.16"

bytes = "1.11.0"

fs2 = "0.4.3"
fs_extra = "1.3.0"

zstd = { version = "0.14" }

md-5 = "0.11.0"
digest-io = "0.1.0"
base16ct = "1.0.0"

rand = "0.10.0"

paimon = { git = "https://dawn.wine/lily/paimon", version = "0.1.0", optional = true }

[build-dependencies]
md-5 = "0.11.0"
prost-build = "0.14.3"
base16ct = "1.0.0"
