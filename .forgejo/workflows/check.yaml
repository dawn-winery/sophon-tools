on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/*.rs"
      - ".forgejo/workflows/**"

jobs:
  check:
    runs-on: selfhosted
    steps:
      - uses: actions/checkout@v5

      - name: Setup rust toolchain and cache
        uses: https://codeberg.org/prjunnamed/setup-rust-toolchain@f0e3fff1ca3442708aa9fb8156820eb859d80846

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install protobuf-compiler musl-tools
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-unknown-linux-musl-gcc

      - name: cargo check
        run: cargo check --target x86_64-unknown-linux-musl --verbose
