on: 
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: selfhosted
    steps:
      - uses: actions/checkout@v5

      - name: Setup rust toolchain and cache
        uses: https://codeberg.org/prjunnamed/setup-rust-toolchain@f0e3fff1ca3442708aa9fb8156820eb859d80846

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install protobuf-compiler

      - name: Build
        run: |
          cargo build --release --bin sophon-cli

      - name: Upload built binary to the release
        uses: https://git.michaelsasser.org/actions/upload-release-assets@v1
        with:
          assets: |
            target/release/sophon-cli
          token: ${{ forge.token }}
          repo_tag: ${{ forge.ref_name }}
